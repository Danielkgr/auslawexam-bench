[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auslex"
version = "0.1.0"
description = "AusLawExam-Bench: a reproducible benchmark of Australian legal reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Glynn-Roe" }]
keywords = ["benchmark", "law", "australia", "llm", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Intentionally minimal: pydantic for the schema, stdlib (urllib, json, random)
# for everything else so the harness runs with a single install and no keys.
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# Only needed for the Hugging Face parquet export; JSONL export works without it.
hf = ["datasets>=2.19"]
# The Claude slot runs on the official Anthropic SDK.
claude = ["anthropic>=1.11,<2"]
# Pinned so the CI lint, format, and type checks match a local run.
dev = [
    "pytest>=8",
    "anthropic>=1.11,<2",
    "httpx>=0.27",
    "ruff==0.16.8",
    "mypy==2.3.1",
]
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
auslex = "auslex.cli:main"
auslex-ui = "backend.cli:main"

# auslex lives under src/, and the backend for auslex-ui sits at the top level.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["auslex*", "backend*"]

# The built web client, which auslex-ui serves when frontend/dist is absent.
[tool.setuptools.package-data]
"auslex.publish" = ["assets/*.html", "assets/assets/*.css", "assets/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "src/auslex/publish/assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long string literals in prompts and tests are clearer unbroken.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The CLI resolves the repository root before importing the package modules.
"src/auslex/cli.py" = ["E402"]
# Tests put the src tree and the tests directory on sys.path first.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/auslex", "backend"]
ignore_missing_imports = true
warn_unused_ignores = true
