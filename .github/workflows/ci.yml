name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  no-venv:
    name: no virtual environment committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # .gitignore only knows the usual names.  pyvenv.cfg marks any venv, virtualenv
      # or uv environment whatever it is called, and site-packages/ catches conda ones.
      - name: Fail if a virtual environment is tracked
        run: |
          if git ls-files | grep -E '(^|/)(pyvenv\.cfg$|site-packages/)'; then
            echo "::error::A Python virtual environment is committed.  Untrack it with 'git rm -r --cached <dir>' and add the directory to .gitignore."
            exit 1
          fi
